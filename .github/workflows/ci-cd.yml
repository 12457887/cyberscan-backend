name: CI/CD CyberScan Backend

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ahmedaminehamden/cyberscan-backend:latest

      - name: Deploy to k3s
        run: |
          docker save ahmedaminehamden/cyberscan-backend:latest | sudo k3s ctr images import -
          kubectl rollout restart deployment/fastapi-pod -n cyberscan
