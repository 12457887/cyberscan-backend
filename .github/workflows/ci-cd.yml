name: CI/CD CyberScan Backend

on:
  push:
    branches: [ main ]

jobs:
  build-push-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ahmedaminehamden/cyberscan-backend:latest

      - name: Deploy to k3s
        run: |
          export KUBECONFIG=/home/bi/.kube/config
          kubectl get nodes
          kubectl rollout restart deployment fastapi-pod -n cyberscan
          kubectl rollout status deployment fastapi-pod -n cyberscan
